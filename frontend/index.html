<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SinkedIn</title>
  </head>
  <body>
    <!--
      This single <div id="root"> is where the entire React app mounts.
      src/main.tsx finds this element and renders <App /> into it.
      Vite injects the bundled script tag below during build/dev.
    -->

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
